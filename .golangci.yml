version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      # CLI/report rendering writes through a sticky writer (internal/cli) or
      # strings.Builder; write errors are surfaced once, not per call.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G304 # file paths come from the operator's own CLI arguments
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam, errcheck]
formatters:
  enable:
    - gofmt
    - goimports
